<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Charcoal Background matching brand Adobe Firefly asset -->
  <rect width="32" height="32" rx="7" fill="#1E1F1E"/>
  
  <!-- Hanger Hook -->
  <path d="M15 5.5 C16.8 5.5 18 6.5 18 8 C18 9.5 16.5 10.5 16 11.5 L16 13" stroke="#4B5563" stroke-width="1.6" stroke-linecap="round"/>
  
  <!-- Hanger Frame / Shoulder Outline -->
  <path d="M4 22 L15.5 13.5 M28 22 L21 16.5" stroke="#374151" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M4 22 C4 23 5 23.5 6 23.5 L11 23.5 M21 23.5 L26 23.5 C27 23.5 28 23 28 22" stroke="#374151" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Isometric Stylized S -->
  <path d="M12 15.5 L15.5 13.5 L19 15.5 L15.5 17.5 L12 19.5 L15.5 21.5 L19 19.5" stroke="#E5E7EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 15.5 V19.5 M19 15.5 V19.5" stroke="#9CA3AF" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- AI Circuit Chip with luminous Cyan (#18F4FC) -->
  <rect x="20.5" y="11.5" width="5" height="5" rx="1" fill="#18F4FC" fill-opacity="0.25" stroke="#18F4FC" stroke-width="1.2"/>
  <circle cx="23" cy="14" r="1.2" fill="#18F4FC"/>
  <!-- Circuit Traces -->
  <path d="M23 11.5 V10 M23 16.5 V18 M20.5 14 H19 M25.5 14 H27" stroke="#18F4FC" stroke-width="0.9" stroke-linecap="round"/>
  <circle cx="27" cy="14" r="0.6" fill="#18F4FC"/>
  <circle cx="23" cy="10" r="0.6" fill="#18F4FC"/>
</svg>
