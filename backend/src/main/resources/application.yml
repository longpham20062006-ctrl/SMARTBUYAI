server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smartbuy-backend

  datasource:
    url: jdbc:h2:file:./data/smartbuydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:3000"
  ai:
    tryon-server-url: "http://127.0.0.1:7860"
    timeout-ms: 60000
    llm:
      provider: ${LLM_PROVIDER:auto}
      api-key: ${GEMINI_API_KEY:${OPENAI_API_KEY:}}
      model: ${LLM_MODEL:gemini-1.5-flash}
      temperature: 0.7
      timeout-ms: 15000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
